name: tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

# 注意：`-o addopts=""` 用来中和各包 pyproject 里为本地开发准备的 addopts
# （coverage html / xdist / testmon 等）。CI 只关心测试结论，避免插件差异
# 造成"本地过、CI 挂"的假失败。

jobs:
  test-miroflow-agent:
    name: miroflow-agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/miroflow-agent
    env:
      # 来源注册表 / 引用契约 / M3 结论核验 / §0 证据账本相关的定向测试集
      TEST_FILES: >-
        tests/test_model_failback.py
        tests/test_task_logger_timing.py
        tests/test_result_cache.py
        tests/test_source_registry_contract.py
        tests/test_scrape_source_state.py
        tests/test_claim_verification.py
        tests/test_claim_verification_wiring.py
        tests/test_report_citations_contract.py
        tests/test_report_presentation.py
        tests/test_deep_early_stop_exit.py
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: |
          uv run pytest $TEST_FILES -v --tb=short -o addopts="" 2>&1
          echo '## miroflow-agent test results' >> $GITHUB_STEP_SUMMARY
          if uv run pytest $TEST_FILES -q --tb=line -o addopts="" 2>&1 | tee /tmp/test-output.txt; then
            echo '✅ All tests passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '❌ Some tests failed.' >> "$GITHUB_STEP_SUMMARY"
            {
              echo '```'
              cat /tmp/test-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  test-miroflow-tools:
    name: miroflow-tools tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/miroflow-tools
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: |
          uv run pytest src/test -v --tb=short -o addopts="" 2>&1
          echo '## miroflow-tools test results' >> $GITHUB_STEP_SUMMARY
          if uv run pytest src/test -q --tb=line -o addopts="" 2>&1 | tee /tmp/test-output.txt; then
            echo '✅ All tests passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '❌ Some tests failed.' >> "$GITHUB_STEP_SUMMARY"
            {
              echo '```'
              cat /tmp/test-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  test-gradio-demo:
    name: gradio-demo tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gradio-demo
    env:
      # 含 API↔Demo 同编号同链接的引用契约、Q1 mermaid 渲染器与静态资源检查
      TEST_FILES: >-
        tests/test_stop_current_api.py
        tests/test_output_detail_level_routing.py
        tests/test_render_markdown.py
        tests/test_static_assets.py
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: |
          uv run pytest $TEST_FILES -v --tb=short -o addopts="" 2>&1
          echo '## gradio-demo test results' >> $GITHUB_STEP_SUMMARY
          if uv run pytest $TEST_FILES -q --tb=line -o addopts="" 2>&1 | tee /tmp/test-output.txt; then
            echo '✅ All tests passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '❌ Some tests failed.' >> "$GITHUB_STEP_SUMMARY"
            {
              echo '```'
              cat /tmp/test-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  test-api-server:
    name: api-server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-server
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
